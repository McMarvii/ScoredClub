name: Deploy Dashboard (GitHub Pages)

# Publishes the static frontend (frontend/) to GitHub Pages. The dashboard
# data is regenerated from the latest committed research file on each deploy,
# so the hosted site always reflects the current scores.
#
# Setup (one-time): repository Settings -> Pages -> Source: "GitHub Actions".
# Private repositories require a plan that includes Pages.
#
# Like the other automation, this runs from the DEFAULT branch (push) or via
# manual dispatch once the workflow exists on the default branch.

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - "data/research/**"
      - "scripts/refresh_frontend_data.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install .
      - name: Regenerate dashboard data from latest research
        run: |
          scoredclub init-db
          scoredclub seed
          RESEARCH="$(ls -1 data/research/berlin_research_*.json 2>/dev/null | sort | tail -n 1 || true)"
          if [ -n "$RESEARCH" ]; then
            scoredclub run --research "$RESEARCH" --skip-collectors
          else
            scoredclub run --skip-collectors
          fi
          python scripts/refresh_frontend_data.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
