# Alembic configuration for ScoredClub.
#
# The database URL is taken from the DATABASE_URL environment variable at
# runtime (see migrations/env.py); the value below is only a fallback used by
# bare `alembic` invocations without DATABASE_URL set.
[alembic]
script_location = src/scoredclub/migrations
prepend_sys_path = src
path_separator = os
sqlalchemy.url = sqlite:///data/scoredclub.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
